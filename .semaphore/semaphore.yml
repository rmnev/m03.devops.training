version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Code Signing
    dependencies: []
    task:
      jobs:
        - name: GPG file
          commands:
            - checkout
            - gpg --import /home/semaphore/public.key
            - gpg --import /home/semaphore/private.key
            - cd 1-signing
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - gpg --verify artifact.txt.sig artifact.txt
            - artifact push workflow artifact.txt
      secrets:
        - name: GPG-Roman
  - name: Generate SBOM
    dependencies:
      - Code Signing
    task:
      jobs:
        - name: SBOM
          commands:
            - checkout
            - cd 2-sbom
            - pip install --user cyclonedx-bom
            - 'export PATH="$HOME/.local/bin:$PATH"'
            - cyclonedx-py requirements -o bom.json
            - artifact push workflow bom.json
      secrets:
        - name: GPG-Roman
  - name: Dependency
    dependencies:
      - Generate SBOM
    task:
      secrets:
        - name: GPG-Roman
      jobs:
        - name: Scanning
          commands:
            - checkout
            - cd 3-dependency-scanning
            - sudo apt-get update
            - sudo apt-get install -y python3-venv
            - pip install -r requirements.txt
            - pip install --user pip-audit
            - 'export PATH="$HOME/.local/bin:$PATH"'
            - pip-audit || true
  - name: SAST testing
    dependencies:
      - Dependency
    task:
      jobs:
        - name: SAST
          commands:
            - checkout
            - cd 4-sast
            - pip install --user bandit
            - 'export PATH="$HOME/.local/bin:$PATH"'
            - bandit -r vulnerable_script.py || true
  - name: DAST testing
    dependencies:
      - SAST testing
    task:
      jobs:
        - name: DAST
          commands:
            - checkout
            - cd 5-dast
            - sudo apt-get install -y wapiti
            - 'export PATH="$HOME/.local/bin:$PATH"'
            - pip install --user gunicorn
            - 'export PATH="$HOME/.local/bin:$PATH"'
            - 'gunicorn -b 0:0:0:0:4000 app:app --daemon'
            - sleep 5
            - 'wapiti -u http://localhost:4000 -f html'
            - artifact push workflow /root/.wapiti/generated_report
