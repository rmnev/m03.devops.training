version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Import
    dependencies: []
    task:
      jobs:
        - name: GPG keys
          commands:
            - gpg --import /home/semaphore/public.key
            - gpg --import /home/semaphore/private.key
      secrets:
        - name: GPG-Roman
  - name: "\U0001F680 Deploy"
    dependencies:
      - Import
    task:
      jobs:
        - name: Generate signatire
          commands:
            - checkout
            - cd 1-signing
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - gpg --verify artifact.txt.sig artifact.txt
            - artifact push workflow artifact.txt
      secrets:
        - name: GPG-Roman
