version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Code Signing
    dependencies: []
    task:
      jobs:
        - name: GPG file
          commands:
            - checkout
            - gpg --import /home/semaphore/public.key
            - gpg --import /home/semaphore/private.key
            - cd 1-signing
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - gpg --verify artifact.txt.sig artifact.txt
            - artifact push workflow artifact.txt
      secrets:
        - name: GPG-Roman
  - name: Generate SBOM
    dependencies:
      - Code Signing
    task:
      jobs:
        - name: SBOM
          commands:
            - checkout
            - cd 2-sbom
            - pip install cyclonedx-bom
            - python -m cyclonedx_bom requirements -o bom.json
            - artifact push workflow bom.json
      secrets:
        - name: GPG-Roman
